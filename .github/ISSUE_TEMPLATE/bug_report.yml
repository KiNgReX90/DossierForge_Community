name: Problem
description: Something in DossierForge does not work as expected.
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Anyone can read this page, so leave out logs, personal data and anything from your dossier. To send logs privately, open Settings, Feedback in DossierForge and press Problem on the In the app row, or mail problem@dossierforge.com.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DossierForge version
      placeholder: The version shown in the app
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots help. Remove paths, names, email addresses and anything from your dossier first.
