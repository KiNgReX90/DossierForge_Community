name: Bug report
description: Something in DossierForge does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer to reach us privately? Email support@skoft.app.
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with DossierForge. Please do not include personal data, secrets or confidential product details; this repository is public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DossierForge version
      placeholder: The version shown in the app
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or log excerpts help. Remove paths, names and email addresses first.
