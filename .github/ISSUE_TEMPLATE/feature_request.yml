name: Feature request
description: Suggest an idea or improvement for DossierForge.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer to reach us privately? Email support@skoft.app.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or task where DossierForge falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
