name: Idea
description: Suggest an idea or improvement for DossierForge.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Anyone can read this page. To send an idea privately, mail idea@dossierforge.com.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or task where DossierForge falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
